<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MiniGol Club v2 · Cuaderno de campo</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; }
  /* Override design canvas bg to match cuaderno */
  body { background: #E8DDB8 !important; }
  .design-canvas-bg { background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px); background-size: 24px 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="layout.jsx"></script>
<script type="text/babel" src="page-home.jsx"></script>
<script type="text/babel" src="page-category.jsx"></script>
<script type="text/babel" src="page-article.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "density": "comfortable",
    "accent": "default",
    "showTactics": true
  }/*EDITMODE-END*/;

  function App() {
    const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

    useEffect(() => {
      document.documentElement.dataset.theme = tweaks.theme || "light";
    }, [tweaks.theme]);

    // Placeholder onNav (each artboard is its own; cards are visual)
    const onNav = (kind, slug) => { /* visual prototype */ };

    const frame = (device, content) => {
      const w = device === "mobile" ? 390 : 1280;
      const h = device === "mobile" ? 844 : 900;
      return (
        <div style={{
          width: w, height: h, overflow: "auto", background: "var(--color-background)",
          borderRadius: 18, position: "relative", border: "1px solid var(--color-border)",
        }} className="artboard-scroll">
          {content}
        </div>
      );
    };

    return (
      <>
        <DesignCanvas defaultZoom={0.55}>
          <DCSection id="home" title="01 · Home — primera impresión del padre">
            <DCArtboard id="home-mobile" label="Home · mobile · 390" width={390} height={844}>
              {frame("mobile", <HomePage device="mobile" tweaks={tweaks} onNav={onNav}/>)}
            </DCArtboard>
            <DCArtboard id="home-desktop" label="Home · desktop · 1280" width={1280} height={900}>
              {frame("desktop", <HomePage device="desktop" tweaks={tweaks} onNav={onNav}/>)}
            </DCArtboard>
          </DCSection>

          <DCSection id="cat" title="02 · Categoría /ejercicios/ — hub temático SEO">
            <DCArtboard id="cat-mobile" label="Categoría · mobile · 390" width={390} height={844}>
              {frame("mobile", <CategoryPage device="mobile" catSlug="ejercicios" tweaks={tweaks} onNav={onNav}/>)}
            </DCArtboard>
            <DCArtboard id="cat-desktop" label="Categoría · desktop · 1280" width={1280} height={900}>
              {frame("desktop", <CategoryPage device="desktop" catSlug="ejercicios" tweaks={tweaks} onNav={onNav}/>)}
            </DCArtboard>
          </DCSection>

          <DCSection id="art" title="03 · Artículo — la pieza de oro (95% del tráfico)">
            <DCArtboard id="art-mobile" label="Artículo · mobile · 390" width={390} height={844}>
              {frame("mobile", <ArticlePage device="mobile" tweaks={tweaks} onNav={onNav}/>)}
            </DCArtboard>
            <DCArtboard id="art-desktop" label="Artículo · desktop · 1280" width={1280} height={1100}>
              {frame("desktop", <ArticlePage device="desktop" tweaks={tweaks} onNav={onNav}/>)}
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel title="Tweaks · MiniGol v2">
          <TweakSection title="Apariencia">
            <TweakRadio label="Tema" value={tweaks.theme} onChange={v => setTweak("theme", v)}
              options={[{value:"light",label:"Light"},{value:"dark",label:"Dark"}]}/>
            <TweakRadio label="Densidad" value={tweaks.density} onChange={v => setTweak("density", v)}
              options={[{value:"comfortable",label:"Cómodo"},{value:"compact",label:"Compacto"}]}/>
          </TweakSection>
          <TweakSection title="Decoración">
            <TweakToggle label="Pizarra táctica embebida en artículo" value={tweaks.showTactics} onChange={v => setTweak("showTactics", v)}/>
          </TweakSection>
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
