name: Feature / Mejora
description: Nueva funcionalidad o mejora a una existente
labels: ["feat"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué necesita construirse y por qué
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notas
    attributes:
      label: Notas técnicas
      description: Archivos relevantes, restricciones, decisiones previas (opcional)

  - type: dropdown
    id: esfuerzo
    attributes:
      label: Esfuerzo estimado
      options:
        - S (< 1 día)
        - M (1-2 días)
        - L (2-3 días)
        - XL (3-5 días, considerar dividir)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - UI / Componentes
        - Contenido / MDX
        - SEO técnico
        - Monetización
        - Performance / CWV
        - Infra / CI / Deploy
