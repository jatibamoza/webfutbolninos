name: Social Scheduler

# Lee content/social/calendar.json, encuentra posts approved cuyo
# scheduled_at cae dentro de la ventana actual, los publica vía
# Instagram Graph API (Meta) y commitea el calendario actualizado.
#
# Cron cada 30 minutos. Window por defecto 120min para tolerar saltos
# de runs (GitHub Actions cron puede saltarse 1-2 runs en horas pico).
#
# REQUISITOS de secrets:
#   - IG_ACCESS_TOKEN          long-lived User/System token con permisos
#                              instagram_basic + instagram_content_publish
#   - IG_BUSINESS_ACCOUNT_ID   IG Business Account ID (no la Page ID)
#   - BOT_PAT                  fine-grained PAT del owner (Contents:write)
#                              necesario porque github-actions[bot] no puede
#                              pushear directo a main por branch protection.
#                              Si falta, fallback a GITHUB_TOKEN (publicará
#                              pero el commit del calendar fallará).

on:
  schedule:
    # Cada 30min UTC. Ajustar si Publer satura o queremos menos requests.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo loggear, no llamar a Publer ni commitear'
        type: boolean
        default: false

permissions:
  contents: write  # necesario para commitear el calendar.json actualizado

concurrency:
  group: social-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    name: Run scheduler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # PAT del owner para poder pushear directo a main bypaseando
          # branch protection. Si no hay BOT_PAT, fallback a GITHUB_TOKEN
          # (el publish funcionará pero el commit fallará al final).
          token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validar calendar.json
        run: node scripts/social/validate-calendar.mjs

      - name: Ejecutar scheduler
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/social/scheduler.mjs --dry-run
          else
            node scripts/social/scheduler.mjs
          fi

      - name: Commit cambios en calendar.json
        # always() para que tras un fallo de Publer también persistamos
        # los cambios de status (failed/error) en el calendar y no quede
        # un post zombi reintentando cada 30min hasta caer fuera del window.
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          if git diff --quiet content/social/calendar.json; then
            echo "Sin cambios — nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/social/calendar.json
          git commit -m "chore(social): scheduler $(date -u +%Y-%m-%dT%H:%MZ) — actualizar status"
          # Pull --rebase por si llegó un commit en paralelo (extremadamente raro
          # con concurrency group, pero defensivo).
          git pull --rebase origin main || true
          if ! git push; then
            echo "::error::Push a main falló — branch protection rechaza al bot."
            echo "::error::Configura un PAT del owner como secret BOT_PAT (Contents:write sobre este repo)."
            echo "::error::Ver: docs/SchedulerInstagram.md sección 'Setup' / BOT_PAT."
            exit 1
          fi
